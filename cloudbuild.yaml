# ==============================================================================
# Google Cloud Build Pipeline for Family Health Vault AI
# ==============================================================================
# Architecture & Security Guarantees:
# 1. Zero Build-Time Secret Exposure:
#    - No API keys (GEMINI_API_KEY, Firebase credentials, etc.) are passed as
#      build arguments (--build-arg) or baked into Docker layers.
#    - Build artifacts remain 100% agnostic of production secrets.
#
# 2. Runtime Secret Injection:
#    - Secrets are mounted securely into Cloud Run at container startup
#      either via Google Cloud Secret Manager (--update-secrets) or Cloud Run
#      environment variables.
#    - Sensitive values reside purely in ephemeral runtime memory.
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Build Container Image
  # Multi-stage Docker build without exposing any environment secrets
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest'
      - '.'

  # ----------------------------------------------------------------------------
  # Step 2: Push Container Image to Google Artifact Registry
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME'

  # ----------------------------------------------------------------------------
  # Step 3: Deploy to Google Cloud Run
  # Deploys service with serverless scale-to-zero and runtime secret injection
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--set-env-vars=NODE_ENV=production'
      # Mount GEMINI_API_KEY from Google Cloud Secret Manager at runtime:
      # If you manage the secret in Secret Manager, uncomment the flag below:
      # - '--update-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'

# Track pushed container images in Google Cloud Build history
images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest'

# Configurable build substitutions with safe defaults
substitutions:
  _SERVICE_NAME: 'family-health-vault'
  _REGION: 'us-central1'
  _REPOSITORY: 'cloud-run-source-deploy'

# Build configuration options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
